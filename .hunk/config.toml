# Load the extension package from this repository's root.
[extensions]
paths = ["."]

# Configure the hunk-guide extension.
[extension.hunk-guide]
# Use the bundled example guide when reviewing the fixture patch.
file = "fixtures/basic-guide.json"
# Open the Guide pane when Hunk starts.
default_open = true
# Place the Guide pane on the right side of the review.
placement = "right"
# Prefer 4–7 sections; alternatives are "compact" (3–5) and "thorough" (6–10).
detail = "balanced"
# Warn when a guide exceeds this threshold without dropping or combining sections.
max_sections = 7
# Keep behavioral verification visible; hide secondary and mechanical sections initially.
show_verification = true
show_supporting = false
show_mechanical = false
