# Load the extension package from this repository's root.
[extensions]
paths = ["."]

# Configure the hunk-guide extension.
[extension.hunk-guide]
# Use the bundled example guide when reviewing the fixture patch.
file = "fixtures/basic-guide.json"
# Open the Guide pane when Hunk starts.
default_open = true
# Place the Guide pane on the right side of the review.
placement = "right"
# Prefer 4–7 generated sections; alternatives are "compact" (3–5) and "thorough" (6–10).
density = "balanced"
# Keep behavioral verification visible; hide secondary and mechanical sections initially.
show_verification = true
show_supporting = false
show_mechanical = false

# Keybindings are user-only: copy the entries you want to customize to
# ~/.config/hunk/config.toml. Hunk ignores keybindings in repository config.
#
# [keybindings]
# "hunk-guide.toggle" = "alt+g"
# "hunk-guide.next-section" = "alt+j"
# "hunk-guide.previous-section" = "alt+k"
# "hunk-guide.next-target" = "alt+l"
# "hunk-guide.previous-target" = "alt+h"
# "hunk-guide.overview" = "alt+o"
# "hunk-guide.toggle-reviewed" = "alt+r"
# "hunk-guide.toggle-section-reviewed" = "alt+R"
# "hunk-guide.checkpoint" = "alt+c"
# "hunk-guide.toggle-scope" = "alt+v"
